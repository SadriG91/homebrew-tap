# Tap CI: audit, build from source, and test every formula in the tap on each
# push/PR — so a bad formula bump can't reach users. Add new formulas to the
# matrix as the tap grows.
name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  test:
    runs-on: macos-15
    strategy:
      matrix:
        formula: [fanknob]
    steps:
      - uses: actions/checkout@v4

      - name: Wire this checkout up as the tap
        run: |
          TAPS="$(brew --repository)/Library/Taps/sadrig91"
          mkdir -p "$TAPS"
          ln -s "$GITHUB_WORKSPACE" "$TAPS/homebrew-tap"

      - name: Audit formula
        run: brew audit --strict sadrig91/tap/${{ matrix.formula }}

      - name: Build from source
        run: brew install --build-from-source sadrig91/tap/${{ matrix.formula }}

      - name: Run formula test
        run: brew test sadrig91/tap/${{ matrix.formula }}
