# Tap CI: lint every cask on each push/PR, so a bad bump can't reach users.
#
# The audit is deliberately offline. `--online` would fetch the release asset
# and verify its checksum, but the release workflow bumps `version` and `sha256`
# together from the artifact it just published, and a freshly-authored cask
# points at a release that doesn't exist yet — so an online audit fails for
# reasons that have nothing to do with the cask being wrong.
name: test

on:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/test.yml"

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  audit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Wire this checkout up as the tap
        run: |
          TAPS="$(brew --repository)/Library/Taps/sadrig91"
          mkdir -p "$TAPS"
          ln -s "$GITHUB_WORKSPACE" "$TAPS/homebrew-tap"

      - name: Style
        run: brew style sadrig91/tap

      - name: Audit
        run: brew audit --cask --strict sadrig91/tap/fanknob
